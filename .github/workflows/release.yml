# Сборка установщиков для Windows и Mac и выпуск новой версии.
# Запускается, когда в репозиторий отправлен тег вида v1.0.1. Сначала создаётся один выпуск на GitHub,
# потом обе сборки кладут в него свои файлы (раньше Windows и Mac создавали по выпуску одновременно).
# Установленные программы находят новый выпуск и предлагают обновиться.
name: Сборка и выпуск

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Создать выпуск
        run: gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --title "${TAG#v}" --notes "Мизансцена ${TAG#v}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Сборка
        run: npx electron-builder ${{ matrix.os == 'windows-latest' && '--win' || '--mac' }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # Адрес обновлений вшит в программу и указывает на публичный репозиторий с одними установщиками (PUB).
      # В этот репозиторий (код закрыт) файлы кладём в том числе токеном RELEASES_TOKEN из настроек репозитория;
      # без токена файлы остаются только в выпуске этого репозитория.
      - name: Загрузка в выпуски
        shell: bash
        run: |
          files=$(ls dist/*.exe dist/*.dmg dist/*.zip dist/*.blockmap dist/latest*.yml 2>/dev/null || true)
          echo "$files"
          gh release upload "$TAG" $files --clobber --repo "$REPO"
          if [ -n "$RELEASES_TOKEN" ]; then
            GH_TOKEN="$RELEASES_TOKEN" gh release create "$TAG" --repo "$PUB" --title "${TAG#v}" --notes "Мизансцена ${TAG#v}" || true
            GH_TOKEN="$RELEASES_TOKEN" gh release upload "$TAG" $files --clobber --repo "$PUB"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          PUB: main-roman/mizanscena-releases
